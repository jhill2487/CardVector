
<!doctype html><html><head><meta charset="utf-8"><title>Putnam Scanner Studio v0.7</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#111;color:#eee} header{padding:12px 16px;background:#202020;border-bottom:1px solid #333} main{display:grid;grid-template-columns:1fr 390px;height:calc(100vh - 55px)} #left{position:relative;overflow:hidden;background:#222} #right{padding:12px;overflow:auto;border-left:1px solid #333} #drop{border:2px dashed #777;padding:18px;text-align:center;margin-bottom:10px;border-radius:8px;background:#181818} button,input{margin:4px;padding:8px} canvas{background:#333;display:block;max-width:100%;max-height:100%}.card{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:10px;margin:8px 0} pre{white-space:pre-wrap;background:#080808;padding:10px;border-radius:6px;max-height:360px;overflow:auto}.hint{color:#bbb;font-size:13px}.ok{color:#7CFC00}.warn{color:#ffd166}.bad{color:#ff6b6b}</style></head><body>
<header><b>Putnam Scanner Studio v0.7</b> <span class="hint">Auto border preview → edit/accept → run scanner</span></header>
<main><section id="left"><canvas id="canvas"></canvas></section><aside id="right">
<div id="drop">Drop card photo here<br><input id="file" type="file" accept="image/*"></div>
<div class="card"><button id="auto">Auto Border Preview</button><button id="scan">Run Scanner</button><button id="save">Save Manual Border Label</button><button id="reset">Reset View</button><p class="hint">Drag green corner points to correct border. Mouse wheel zoom. Hold Space + drag to pan.</p></div>
<div class="card"><b>Status</b><div id="status">Load an image.</div></div>
<div class="card"><b>Result</b><pre id="result">{}</pre></div>
<div class="card"><b>Debug Links</b><div id="links"></div></div>
</aside></main>
<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'); let img=null,fileObj=null,filename='', scale=1, ox=0, oy=0, dragging=null, panning=false, last=null;
let pts=[]; const W=734,H=1024;
function setStatus(s,cls=''){document.getElementById('status').innerHTML='<span class="'+cls+'">'+s+'</span>'}
function fit(){ if(!img)return; canvas.width=document.getElementById('left').clientWidth; canvas.height=document.getElementById('left').clientHeight; scale=Math.min(canvas.width/img.width,canvas.height/img.height)*0.95; ox=(canvas.width-img.width*scale)/2; oy=(canvas.height-img.height*scale)/2; draw(); }
function toScreen(p){return {x:ox+p.x*scale,y:oy+p.y*scale}} function toImg(x,y){return {x:(x-ox)/scale,y:(y-oy)/scale}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height); if(!img)return; ctx.drawImage(img,ox,oy,img.width*scale,img.height*scale); if(pts.length===4){ctx.lineWidth=3;ctx.strokeStyle='lime';ctx.beginPath(); pts.forEach((p,i)=>{let s=toScreen(p); if(i)ctx.lineTo(s.x,s.y); else ctx.moveTo(s.x,s.y)});ctx.closePath();ctx.stroke(); pts.forEach((p,i)=>{let s=toScreen(p);ctx.fillStyle='lime';ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillText(String(i+1),s.x-3,s.y+4)})}}
function loadFile(f){fileObj=f; filename=f.name; let url=URL.createObjectURL(f); img=new Image(); img.onload=()=>{pts=[{x:img.width*.08,y:img.height*.08},{x:img.width*.92,y:img.height*.08},{x:img.width*.92,y:img.height*.92},{x:img.width*.08,y:img.height*.92}]; fit(); setStatus('Image loaded: '+filename,'ok')}; img.src=url;}
document.getElementById('file').onchange=e=>loadFile(e.target.files[0]); ['dragenter','dragover'].forEach(ev=>document.getElementById('drop').addEventListener(ev,e=>{e.preventDefault();})); document.getElementById('drop').ondrop=e=>{e.preventDefault(); if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
canvas.onmousedown=e=>{if(!img)return; let m={x:e.offsetX,y:e.offsetY}; if(e.button===1||e.shiftKey||window.space){panning=true; last=m; return} let best=-1,bd=999; pts.forEach((p,i)=>{let s=toScreen(p),d=Math.hypot(s.x-m.x,s.y-m.y); if(d<bd){bd=d;best=i}}); if(bd<20)dragging=best;};
canvas.onmousemove=e=>{let m={x:e.offsetX,y:e.offsetY}; if(dragging!==null){pts[dragging]=toImg(m.x,m.y); draw()} else if(panning){ox+=m.x-last.x; oy+=m.y-last.y; last=m; draw()}}; canvas.onmouseup=()=>{dragging=null;panning=false}; canvas.onmouseleave=()=>{dragging=null;panning=false}; canvas.onwheel=e=>{if(!img)return;e.preventDefault();let before=toImg(e.offsetX,e.offsetY);let f=e.deltaY<0?1.12:.89;scale*=f;ox=e.offsetX-before.x*scale;oy=e.offsetY-before.y*scale;draw()}; window.onresize=fit; window.onkeydown=e=>{if(e.code==='Space')window.space=true}; window.onkeyup=e=>{if(e.code==='Space')window.space=false};
function fd(){let form=new FormData(); form.append('image',fileObj,filename); return form}
async function run(endpoint){if(!fileObj){setStatus('Load image first','bad');return} setStatus('Running '+endpoint+'...','warn'); let r=await fetch(endpoint,{method:'POST',body:fd()}); let j=await r.json(); document.getElementById('result').textContent=JSON.stringify(j,null,2); links(j); setStatus(j.status||'done', j.match&&j.match.status==='Auto Match'?'ok':'warn');}
function links(j){let el=document.getElementById('links'); el.innerHTML=''; if(j.debug){for(let [k,u] of Object.entries(j.debug)){if(String(u).startsWith('/')){let a=document.createElement('a');a.href=u;a.target='_blank';a.textContent=k;el.appendChild(a);el.appendChild(document.createElement('br'))}}}}
document.getElementById('scan').onclick=()=>run('/api/scan'); document.getElementById('auto').onclick=()=>run('/api/preview'); document.getElementById('reset').onclick=fit;
document.getElementById('save').onclick=async()=>{if(!img)return;let payload={filename,trainer_version:'studio_v0_7',timestamp:new Date().toISOString(),image_size:{width:img.width,height:img.height},regions:{card:pts,name:[],number:[],setcode:[]}}; let r=await fetch('/api/save_label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); let j=await r.json(); document.getElementById('result').textContent=JSON.stringify(j,null,2); setStatus('Manual border label saved','ok')};
</script></body></html>
