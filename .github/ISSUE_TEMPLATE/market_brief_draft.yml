name: Market Brief Draft
description: Create a draft that GitHub Actions can convert into a CardVector.app market brief PR.
title: "[Content Draft] Pokemon Card Pricing Strategy - YYYY-MM-DD"
labels:
  - content-draft
  - market-brief
body:
  - type: markdown
    attributes:
      value: |
        Paste the reviewed ChatGPT draft here. Add the `ready-for-pr` label only after the article Markdown is ready to become a draft pull request.
  - type: input
    id: filename
    attributes:
      label: Filename
      description: Use YYYY-MM-DD-lowercase-slug.md.
      placeholder: "2026-08-10-pokemon-card-pricing-strategy.md"
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Status
      description: Use Draft while staging. The PR is still reviewed before publishing.
      placeholder: "Draft"
    validations:
      required: false
  - type: textarea
    id: article_file
    attributes:
      label: Article file
      description: Paste the complete Markdown file in a fenced code block.
      placeholder: |
        ```markdown
        ---
        title: "Pokemon Card Pricing Strategy"
        slug: "pokemon-card-pricing-strategy"
        date: "2026-08-10"
        description: "Short SEO description and site teaser."
        label: "Market Brief"
        author: "Putnam Collectibles"
        category: "Pokemon Market Brief"
        status: "published"
        tags:
          - Pokemon
          - Market Updates
          - Selling
        affiliateLinks:
          - "Shop Putnam Collectibles on eBay|https://www.ebay.com/str/jhilltcg?mkcid=1&mkrid=711-53200-19255-0&siteid=0&campid=5339178316&customid=&toolid=10001&mkevt=1"
        ---

        # Pokemon Card Pricing Strategy

        ## What moved

        Article content...
        ```
    validations:
      required: true
  - type: textarea
    id: fact_check_notes
    attributes:
      label: Fact-check notes
      description: Keep time-sensitive claim checks here. These notes are not published to the website.
      placeholder: |
        Time-sensitive statement:
        Source:
        Source date:
        Verification notes:
    validations:
      required: false
  - type: textarea
    id: tiktok_package
    attributes:
      label: TikTok package
      description: Optional short-form content package. This is not published to the website.
      placeholder: |
        Hook:

        Voiceover:

        B-roll:

        CTA:
    validations:
      required: false
