name: Validate Public Site Export

on:
  pull_request:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'Tools/export_cardvector_site.py'
      - 'Tools/check_site_export.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/validate-public-site.yml'

permissions:
  contents: read

jobs:
  export-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check Docs/kaggle-catalog.js
          node --check Docs/wanted/search-savefix-20261110.js
      - name: Test Kaggle catalog parsing and printing separation
        run: node --test Docs/tests/kaggle-catalog.test.cjs
      - name: Verify administrator development dashboard
        run: node --test Docs/tests/development-dashboard.test.cjs Docs/tests/analytics.test.cjs
      - name: Test private image review page and exported route
        run: node --test Docs/tests/image-review.test.cjs
      - name: Check public R2 image index and cross-origin access
        run: |
          python - <<'PY'
          import csv, io, urllib.request
          url = "https://images.cardvector.app/archive/card-image-index.csv"
          req = urllib.request.Request(url, headers={"Origin": "https://cardvector.app", "User-Agent": "CardVector-Catalog-Validation/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status == 200, response.status
              origin = response.headers.get("Access-Control-Allow-Origin", "")
              assert origin in ("*", "https://cardvector.app"), "R2 CORS header absent: " + repr(origin)
              rows = list(csv.DictReader(io.StringIO(response.read().decode("utf-8-sig"))))
          assert len(rows) == 21199, "Expected 21,199 Kaggle image entries, got " + str(len(rows))
          assert all(r.get("RelativePath") for r in rows)
          pikachu_files = sum("pikachu" in r["FileName"].lower() for r in rows)
          assert pikachu_files >= 170, "Pikachu filename coverage unexpectedly dropped: " + str(pikachu_files)
          print("Indexed Pikachu filename candidates:", pikachu_files)
          print("R2 catalog verified:", len(rows), "files; CORS:", origin)
          flare=[r for r in rows if "white-flare" in (r.get("RelativePath") or "").lower()]
          print("WHITE FLARE INDEX COUNT:",len(flare),"FIRST:",[r.get("RelativePath") for r in flare[:8]],"LAST:",[r.get("RelativePath") for r in flare[-3:]])
          from urllib.parse import quote
          from urllib.error import HTTPError,URLError
          for path in [r["RelativePath"].replace(chr(92),"/") for r in flare[:2]+flare[-2:]]:
              req=urllib.request.Request("https://images.cardvector.app/archive/"+quote(path,safe="/"),headers={"User-Agent":"CardVector-R2-Identity-Check/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      print("WHITE FLARE R2:",path,resp.status,resp.headers.get("Content-Type",""),len(resp.read()))
              except (HTTPError,URLError,TimeoutError) as err:
                  print("WHITE FLARE R2:",path,"FAILED",str(err)[:120])

          image_url = "https://images.cardvector.app/archive/Pokemon%20TCG/Pokemon%20TCG/151/sv3-5_en_001_std.jpg"
          with urllib.request.urlopen(urllib.request.Request(image_url, headers={"User-Agent": "CardVector-Catalog-Validation/1.0"}), timeout=30) as image:
              assert image.status == 200
              assert "image/" in image.headers.get("Content-Type", ""), "Image content type missing"
              assert len(image.read()) > 512, "Image response unexpectedly empty"
          print("Known 151 image reachable")
          PY
      - name: Export and validate complete public artifact
        run: |
          python Tools/export_cardvector_site.py --output public-site --source-sha "$GITHUB_SHA"
          python Tools/check_site_export.py public-site Docs
