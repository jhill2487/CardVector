name: Reuse verified-identity Kaggle R2 images for English sets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reuse-kaggle-r2-set.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-existing-artwork-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CARDVECTOR_TARGET_SET_ID: '22872'
      CARDVECTOR_R2_SET_FOLDER: scarlet-violet-promos
      CARDVECTOR_STAGE_R2: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile Tools/reuse_kaggle_r2_set_images.py
      - run: python -m pip install boto3==1.35.99
      - name: Stage strict same-printing artwork from existing R2, for visual review
        run: python Tools/reuse_kaggle_r2_set_images.py
