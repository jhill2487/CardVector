name: PokéWallet card images — newest English sets first
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pokewallet-set-images.yml'
  workflow_dispatch:
    inputs:
      set_id:
        description: "PokéWallet set ID (exclude standalone energy sets)"
        required: true
        default: "24451"
        type: string
      slug:
        description: "R2 folder slug"
        required: true
        default: "mega-evolution-promos"
        type: string
      provider_id:
        description: "Optional exact Staff card provider ID (single-card test)"
        required: false
        type: string
      limit:
        description: "Maximum image requests (honors live API quota)"
        required: true
        default: "1"
        type: choice
        options: ["1", "5", "10", "25", "50", "100"]
permissions:
  contents: read
concurrency:
  group: pokewallet-set-images
  cancel-in-progress: false
jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[promo-image-pilot]') || contains(github.event.head_commit.message, '[staff-image-pilot]') || contains(github.event.head_commit.message, '[promo-batch]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject energy sets
        env:
          SET_ID: ${{ inputs.set_id || '24451' }}
        run: |
          if [ "$SET_ID" = "24461" ]; then echo "::error::Standalone energy sets are excluded"; exit 1; fi
      - name: Verify required credentials
        run: |
          for name in POKEWALLET_API_KEY SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - name: Validate importer syntax
        run: python -m py_compile Tools/import_pokewallet_set_images.py
      - name: Install pinned R2 SDK
        run: python -m pip install boto3==1.35.99
      - name: Stage missing card images in R2 for review
        env:
          SET_ID: ${{ inputs.set_id || '24451' }}
          SET_SLUG: ${{ inputs.slug || 'mega-evolution-promos' }}
          IMAGE_LIMIT: ${{ github.event_name == 'push' && '25' || inputs.limit || '1' }}
          PILOT_PROVIDER_ID: ${{ contains(github.event.head_commit.message, '[staff-image-pilot]') && 'pk_9247a833a9e3e597706f290d436a1f0251bdf53002189a1f7ef444ec97e7fbfbf1df8f74e155481e24816172' || inputs.provider_id || '' }}
        run: |
          args=(--set-id "$SET_ID" --slug "$SET_SLUG" --limit "$IMAGE_LIMIT" --delay 5)
          if [ -n "$PILOT_PROVIDER_ID" ]; then args+=(--provider-id "$PILOT_PROVIDER_ID"); fi
          python Tools/import_pokewallet_set_images.py "${args[@]}"
