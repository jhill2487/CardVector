name: Test catalog reconciliation
on:
  pull_request:
    paths:
      - 'Tools/reconcile_pokewallet_kaggle.py'
      - 'Tools/import_pokewallet_catalog.py'
      - 'Tools/run_daily_pokewallet_import.py'
      - 'Tools/tests/test_daily_pokewallet_import.py'
      - '.github/workflows/daily-pokewallet-import.yml'
      - 'Tools/publish_import_progress.py'
      - 'Tools/tests/test_publish_import_progress.py'
      - 'Tools/tests/test_import_pokewallet_catalog.py'
      - 'Tools/tests/test_reconcile_pokewallet_kaggle.py'
      - '.github/workflows/catalog-reconciliation-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Tools/tests -p 'test_reconcile_pokewallet_kaggle.py' -v
      - run: python -m unittest discover -s Tools/tests -p 'test_import_pokewallet_catalog.py' -v
      - run: python -m unittest discover -s Tools/tests -p 'test_publish_import_progress.py' -v
      - run: python -m unittest discover -s Tools/tests -p 'test_daily_pokewallet_import.py' -v
