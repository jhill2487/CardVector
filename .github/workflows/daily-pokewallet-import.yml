name: PokéWallet metadata — remaining daily API requests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-pokewallet-import.yml'
      - 'Tools/run_daily_pokewallet_import.py'
      - 'Tools/tests/test_daily_pokewallet_import.py'
      - 'Tools/pokewallet_api_budget.py'
      - 'Tools/pokewallet_market_metadata.py'
      - 'Tools/refresh_pokewallet_market.py'
      - 'Tools/tests/test_pokewallet_market_metadata.py'
  workflow_dispatch:
  schedule:
    # Each attempt checks the shared 1,000-call ledger; metadata starts
    # only after the daily 900-image allocation has been spent.
    - cron: '41 10-23 * * *'
permissions:
  contents: read
concurrency:
  group: pokewallet-metadata
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARDVECTOR_IMPORT_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_topup' }}
      CARDVECTOR_DIAGNOSTIC_MODE: ${{ github.event_name == 'schedule' && 'daily' || 'manual_topup' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private importer credentials exist
        id: credentials
        run: |
          if [ -z "$POKEWALLET_API_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Daily import is not activated. Add both repository Actions secrets to start automatic batches."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify metadata checkpoint and diagnostic tests
        if: steps.credentials.outputs.ready == 'true'
        run: |
          python -m unittest discover -s Tools/tests -p 'test_import_diagnostics.py'
          python -m unittest discover -s Tools/tests -p 'test_daily_pokewallet_import.py'
          python -m unittest discover -s Tools/tests -p 'test_pokewallet_api_budget.py'
          python -m unittest discover -s Tools/tests -p 'test_pokewallet_market_metadata.py'
          python -m py_compile Tools/refresh_pokewallet_market.py Tools/pokewallet_market_metadata.py
      - name: Spend only remaining daily API quota on 200-card metadata pages
        if: steps.credentials.outputs.ready == 'true' && github.event_name != 'push'
        run: python Tools/run_import_with_diagnostics.py
