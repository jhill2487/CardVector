name: PokéWallet catalog import (750 scheduled / 250 manual)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-pokewallet-import.yml'
      - 'Tools/run_daily_pokewallet_import.py'
      - 'Tools/tests/test_daily_pokewallet_import.py'
  workflow_dispatch:
  schedule:
    # Images run every hour; keep metadata to ~4 batched API calls
    # late in the day, after image ingestion has first access to quota.
    - cron: '53 23 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'pokewallet-metadata-tests' || 'pokewallet-set-images' }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARDVECTOR_IMPORT_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_topup' }}
      CARDVECTOR_DIAGNOSTIC_MODE: ${{ github.event_name == 'schedule' && 'daily' || 'manual_topup' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private importer credentials exist
        id: credentials
        run: |
          if [ -z "$POKEWALLET_API_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Daily import is not activated. Add both repository Actions secrets to start automatic batches."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify metadata checkpoint and diagnostic tests
        if: steps.credentials.outputs.ready == 'true'
        run: |
          python -m unittest discover -s Tools/tests -p 'test_import_diagnostics.py'
          python -m unittest discover -s Tools/tests -p 'test_daily_pokewallet_import.py'
      - name: Import up to 750 card metadata records in 200-card pages (checkpoint-safe)
        if: steps.credentials.outputs.ready == 'true' && github.event_name != 'push'
        run: python Tools/run_import_with_diagnostics.py
