name: PokéWallet catalog import (750 scheduled / 250 manual)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-pokewallet-import.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
permissions:
  contents: read
concurrency:
  group: pokewallet-daily-catalog-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARDVECTOR_IMPORT_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_topup' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private importer credentials exist
        id: credentials
        run: |
          if [ -z "$POKEWALLET_API_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Daily import is not activated. Add both repository Actions secrets to start automatic batches."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import scheduled 750 or manual top-up 250 records (checkpoint-safe)
        if: steps.credentials.outputs.ready == 'true'
        run: python Tools/run_daily_pokewallet_import.py
