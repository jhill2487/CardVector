name: One-time PokéWallet source coverage diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pokewallet-source-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
    steps:
      - name: Check three known-problem English cases without changing data
        shell: python
        run: |
          import json,os,urllib.request,urllib.error,urllib.parse
          key=os.environ.get("POKEWALLET_API_KEY")
          if not key: raise SystemExit("PokéWallet credential absent")
          base="https://api.pokewallet.io"
          def fetch(path,image=False):
            req=urllib.request.Request(base+path,headers={"X-API-Key":key,"User-Agent":"CardVector-Source-Sanity/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=22) as resp:
                if image:
                  data=resp.read(2048)
                  return {"code":resp.status,"mime":resp.headers.get("Content-Type",""),"bytes_sampled":len(data)}
                return json.load(resp)
            except urllib.error.HTTPError as e: return {"error":"HTTP "+str(e.code)}
            except Exception as e: return {"error":type(e).__name__}
          checks=[
            ("Delta Reign Heracross 001/103","/sets/24831?page=1&limit=100","Heracross","001"),
            ("Plasma Freeze older English Weedle 001/116","/sets/1382?page=1&limit=20","Weedle","001")
          ]
          for label,path,name,number in checks:
            data=fetch(path)
            cards=data.get("cards",[]) if isinstance(data,dict) else []
            match=[r for r in cards if name.lower() in str(r.get("card_info",{}).get("name","")).lower() and str(r.get("card_info",{}).get("card_number","")).split("/")[0].lstrip("0")==number.lstrip("0")]
            print("CASE",label,"set_language",data.get("set",{}).get("language") if isinstance(data.get("set"),dict) else "unknown","page_cards",len(cards),"matches",len(match),"api_error",data.get("error"))
            for r in match[:2]:
              info=r.get("card_info",{})
              print(" CARD",str(info.get("name"))[:80],"number",info.get("card_number"),"variants",info.get("variants"),"images_field",r.get("images"),"tcg_price_finishes",[p.get("sub_type_name") for p in (r.get("tcgplayer") or {}).get("prices",[])][:8])
              print(" IMAGE",fetch("/images/"+urllib.parse.quote(str(r.get("id","")))+"?size=low",True))
          data=fetch("/search?q=Pikachu%20Libre&limit=100")
          results=data.get("results",[]) if isinstance(data,dict) else []
          libre=[r for r in results if "pikachu libre" in str(r.get("card_info",{}).get("name","")).lower() or "pikachu libre" in str(r.get("card_info",{}).get("clean_name","")).lower()]
          print("CASE Pikachu Libre search","results",len(results),"libre_matches",len(libre),"api_error",data.get("error"))
          for r in libre[:5]:
            info=r.get("card_info",{})
            print(" CARD",str(info.get("name"))[:70],"set",str(info.get("set_name"))[:60],"number",info.get("card_number"),"image_metadata",r.get("images"),"variants",info.get("variants"),"price_finishes",[p.get("sub_type_name") for p in (r.get("tcgplayer") or {}).get("prices",[])][:8])
            print(" IMAGE",fetch("/images/"+urllib.parse.quote(str(r.get("id","")))+"?size=low",True))
