name: Priority English set metadata and images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/priority-pokewallet-set.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: priority-pokewallet-set
  cancel-in-progress: false
jobs:
  priority-import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CARDVECTOR_TARGET_SET_ID: '22872'
      CARDVECTOR_TARGET_CARD_COUNT: '278'
      CARDVECTOR_TARGET_SLUG: 'scarlet-violet-promo-cards'
      CARDVECTOR_WAIT_HOURLY_RESET: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify priority importer and credentials
        run: |
          python -m py_compile Tools/import_priority_pokewallet_set.py Tools/import_pokewallet_set_images.py
          for name in POKEWALLET_API_KEY SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Install R2 client
        run: python -m pip install boto3==1.35.99
      - name: Bypass metadata window, then stage promo images up to provider quota
        run: python Tools/import_priority_pokewallet_set.py
